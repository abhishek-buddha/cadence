server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/appointments { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8004; }
    location /api/auth { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://login:8001; }
    location /api/users { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://users:8002; }
    location /api/master-data/ { rewrite ^/api/master-data/(.*)$ /$1 break; proxy_pass http://master:8003; }
    location /api/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://api:8004; }
    location /appointment-voice/ { proxy_pass http://api:8004; }
    location /ws/updates {
        proxy_pass http://updates:8006/ws/updates;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
