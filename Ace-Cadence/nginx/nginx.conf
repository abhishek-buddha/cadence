worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream login_svc { server login-svc:8001; }
    upstream user_management_svc { server user-management-svc:8002; }
    upstream master_data_svc { server master-data-svc:8003; }
    upstream call_handling_svc { server call-handling-svc:8004; }
    upstream scheduler_svc { server scheduler-svc:8005; }
    upstream ui_data_loading_svc { server ui-data-loading-svc:8006; }
    upstream reports_dashboards_svc { server reports-dashboards-svc:8007; }
    upstream telephony_bridge_svc { server telephony-bridge-svc:8008; }

    server {
        listen 80;
        server_name _;

        # --- Static frontend build ---
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- REST APIs, path-routed by owning service ---
        location /api/auth {
            rewrite ^/api/auth/?(.*)$ /auth/$1 break;
            proxy_pass http://login_svc;
            include proxy_params.conf;
        }

        location /api/users {
            rewrite ^/api/users/?$ /users break;
            rewrite ^/api/users/(.*)$ /users/$1 break;
            proxy_pass http://user_management_svc;
            include proxy_params.conf;
        }

        location /api/user-groups {
            rewrite ^/api/user-groups/?$ /user-groups break;
            rewrite ^/api/user-groups/(.*)$ /user-groups/$1 break;
            proxy_pass http://user_management_svc;
            include proxy_params.conf;
        }

        location /api/master-data {
            rewrite ^/api/master-data/(providers|insurance-contacts|patients)/?$ /$1 break;
            rewrite ^/api/master-data/?(.*)$ /$1 break;
            proxy_pass http://master_data_svc;
            include proxy_params.conf;
        }

        location /api/claims {
            rewrite ^/api/claims/?$ /claims break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://call_handling_svc;
            include proxy_params.conf;
        }

        location ~ ^/api/(call-sessions|calls|call-results|call-events|call-settings|handoff)(/.*)?$ {
            rewrite ^/api/(call-sessions|calls|call-results|call-events|call-settings)/?$ /$1 break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://call_handling_svc;
            include proxy_params.conf;
        }

        location /api/jobs {
            rewrite ^/api/jobs/?$ /jobs break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://scheduler_svc;
            include proxy_params.conf;
        }

        location /api/ui-data {
            rewrite ^/api/ui-data/?(.*)$ /$1 break;
            proxy_pass http://ui_data_loading_svc;
            include proxy_params.conf;
        }

        location /api/reports {
            rewrite ^/api/reports/?$ /reports break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://reports_dashboards_svc;
            include proxy_params.conf;
        }

        # --- WebSockets ---
        location /ws/updates {
            proxy_pass http://ui_data_loading_svc/ws/updates;
            include proxy_ws_params.conf;
        }

        location ~ ^/ws/listen/(.*)$ {
            proxy_pass http://telephony_bridge_svc/listen/$1;
            include proxy_ws_params.conf;
        }

        location = /call-metadata {
            proxy_pass http://call_handling_svc/call-metadata;
            include proxy_params.conf;
        }

        location = /call-ended {
            proxy_pass http://call_handling_svc/call-ended;
            include proxy_params.conf;
        }

        location = /twilio-request-handoff {
            proxy_pass http://call_handling_svc/twilio-request-handoff;
            include proxy_params.conf;
        }

        location = /twilio-status {
            proxy_pass http://call_handling_svc/twilio-status;
            include proxy_params.conf;
        }
        # --- Twilio-facing endpoints (direct hits from Twilio, not the frontend) ---
        location /media-stream {
            proxy_pass http://telephony_bridge_svc/media-stream;
            include proxy_ws_params.conf;
        }

        location /twiml-/ {
            proxy_pass http://telephony_bridge_svc;
            include proxy_params.conf;
        }

        location /twilio-/ {
            proxy_pass http://telephony_bridge_svc;
            include proxy_params.conf;
        }
    }
}
