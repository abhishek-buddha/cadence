name: Deploy Ace Cadence
# Smart EC2 deploy

on:
  push:
    branches: [Ace_Cadence]
    paths:
      - "Ace-Cadence/**"
      - "Ace-Cadence-Ui/**"
      - "deploy.sh"
      - ".github/workflows/deploy-ace-cadence.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/cadence
            git fetch origin Ace_Cadence
            # Run the new deployment logic while preserving its before/after diff.
            DEPLOY_SCRIPT=$(mktemp)
            trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
            git show origin/Ace_Cadence:deploy.sh > "$DEPLOY_SCRIPT"
            bash "$DEPLOY_SCRIPT"
