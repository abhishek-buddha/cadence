worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream login_svc { server login-svc:8001; }
    upstream user_management_svc { server user-management-svc:8002; }
    upstream master_data_svc { server master-data-svc:8003; }
    upstream call_handling_svc { server call-handling-svc:8004; }
    upstream scheduler_svc { server scheduler-svc:8005; }
    upstream ui_data_loading_svc { server ui-data-loading-svc:8006; }
    upstream reports_dashboards_svc { server reports-dashboards-svc:8007; }
    upstream telephony_bridge_svc { server telephony-bridge-svc:8008; }

    # Internal container-to-container HTTP.
    #
    # cadence-bridge reaches us by Docker DNS name over plain HTTP
    # (CADENCE_API_BASE_URL=http://ace-cadence-nginx-1), so its Host header is
    # NOT our public hostname and it lands here rather than in the redirect
    # server below. These requests must be SERVED, never redirected: the TLS
    # cert is issued for cadence-pro.acelive.ai, so a 301 to
    # https://ace-cadence-nginx-1 fails the handshake and the request dies.
    #
    # Port 80 previously had only the redirect server, which silently broke
    # every bridge -> app call:
    #   /call-metadata          -> agent never got its dynamic variables and so
    #                              read "{{patient_name}}" aloud to the payer
    #   /twilio-request-handoff -> no handoff recorded, no operator notified
    #   /call-ended             -> calls sat in_progress after hangup
    #
    # Host-based separation matters for more than routing: /call-metadata
    # returns patient name/DOB/member id and has no auth of its own, so it must
    # never be reachable in cleartext under the public hostname. The private-range
    # allowlist is defence in depth on top of that (any Docker bridge subnet is
    # RFC1918; the public internet is not).
    server {
        listen 80 default_server;
        server_name _;

        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        # --- bridge -> app endpoints (mirrored in the 443 block) ---
        location = /call-metadata {
            proxy_pass http://call_handling_svc/call-metadata;
            include proxy_params.conf;
        }

        location = /twilio-request-handoff {
            proxy_pass http://call_handling_svc/twilio-request-handoff;
            include proxy_params.conf;
        }

        location = /call-ended {
            proxy_pass http://call_handling_svc/call-ended;
            include proxy_params.conf;
        }

        location = /call-hold-start {
            proxy_pass http://call_handling_svc/call-hold-start;
            include proxy_params.conf;
        }

        # Nothing else is served over plain HTTP.
        location / {
            return 404;
        }
    }

    # Public HTTP -> HTTPS
    server {
        listen 80;
        server_name cadence-pro.acelive.ai www.cadence-pro.acelive.ai;

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name cadence-pro.acelive.ai www.cadence-pro.acelive.ai;

        ssl_certificate /etc/nginx/ssl/cadence-pro.acelive.ai-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/cadence-pro.acelive.ai.key;
        ssl_trusted_certificate /etc/nginx/ssl/cadence-pro.acelive.ai-trusted.pem;

        root /usr/share/nginx/html;
        index index.html;

        # --- Static frontend build ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- REST APIs, path-routed by owning service ---
        location /api/auth {
            rewrite ^/api/auth/?(.*)$ /auth/$1 break;
            proxy_pass http://login_svc;
            include proxy_params.conf;
        }

        location /api/users {
            rewrite ^/api/users/?$ /users break;
            rewrite ^/api/users/(.*)$ /users/$1 break;
            proxy_pass http://user_management_svc;
            include proxy_params.conf;
        }

        location /api/user-groups {
            rewrite ^/api/user-groups/?$ /user-groups break;
            rewrite ^/api/user-groups/(.*)$ /user-groups/$1 break;
            proxy_pass http://user_management_svc;
            include proxy_params.conf;
        }

        location /api/master-data {
            rewrite ^/api/master-data/(providers|insurance-contacts|patients)/?$ /$1 break;
            rewrite ^/api/master-data/?(.*)$ /$1 break;
            proxy_pass http://master_data_svc;
            include proxy_params.conf;
        }

        location /api/claims {
            rewrite ^/api/claims/?$ /claims break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://call_handling_svc;
            include proxy_params.conf;
        }

        location ~ ^/api/(call-sessions|calls|call-results|call-events|call-settings|handoff)(/.*)?$ {
            rewrite ^/api/(call-sessions|calls|call-results|call-events|call-settings)/?$ /$1 break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://call_handling_svc;
            include proxy_params.conf;
        }

        location /api/jobs {
            rewrite ^/api/jobs/?$ /jobs break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://scheduler_svc;
            include proxy_params.conf;
        }

        location /api/ui-data {
            rewrite ^/api/ui-data/?(.*)$ /$1 break;
            proxy_pass http://ui_data_loading_svc;
            include proxy_params.conf;
        }

        location /api/reports {
            rewrite ^/api/reports/?$ /reports break;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://reports_dashboards_svc;
            include proxy_params.conf;
        }

        # --- WebSockets ---
        location /ws/updates {
            proxy_pass http://ui_data_loading_svc/ws/updates;
            include proxy_ws_params.conf;
        }

        location ~ ^/ws/listen/(.*)$ {
            proxy_pass http://telephony_bridge_svc/listen/$1;
            include proxy_ws_params.conf;
        }

        location = /call-metadata {
            proxy_pass http://call_handling_svc/call-metadata;
            include proxy_params.conf;
        }

        location = /call-ended {
            proxy_pass http://call_handling_svc/call-ended;
            include proxy_params.conf;
        }

        location = /twilio-request-handoff {
            proxy_pass http://call_handling_svc/twilio-request-handoff;
            include proxy_params.conf;
        }

        location = /call-hold-start {
            proxy_pass http://call_handling_svc/call-hold-start;
            include proxy_params.conf;
        }

        location = /twilio-status {
            proxy_pass http://call_handling_svc/twilio-status;
            include proxy_params.conf;
        }

        location = /twilio-conference-status {
            proxy_pass http://call_handling_svc/twilio-conference-status;
            include proxy_params.conf;
        }

        location = /twilio-recording-status {
            proxy_pass http://call_handling_svc/twilio-recording-status;
            include proxy_params.conf;
        }

        location = /twilio-transcription {
            proxy_pass http://call_handling_svc/twilio-transcription;
            include proxy_params.conf;
        }

        location = /twilio-recording-media {
            proxy_pass http://call_handling_svc/twilio-recording-media;
            include proxy_params.conf;
        }

        location = /elevenlabs-recording-media {
            proxy_pass http://call_handling_svc/elevenlabs-recording-media;
            include proxy_params.conf;
        }

        location = /elevenlabs-webhook {
            proxy_pass http://call_handling_svc/elevenlabs-webhook;
            include proxy_params.conf;
        }

        location = /twiml-conference-hold {
            proxy_pass http://call_handling_svc/twiml-conference-hold;
            include proxy_params.conf;
        }

        # --- Twilio-facing endpoints ---
        location /media-stream {
            proxy_pass http://cadence-bridge:3001/media-stream;
            include proxy_ws_params.conf;
        }

        location /monitor {
            proxy_pass http://cadence-bridge:3001/monitor;
            include proxy_ws_params.conf;
        }

        location /listen/ {
            proxy_pass http://cadence-bridge:3001/listen/;
            include proxy_ws_params.conf;
        }

        location /start-monitor {
            proxy_pass http://cadence-bridge:3001/start-monitor;
            include proxy_params.conf;
        }

        location = /twiml-call-start {
            proxy_pass http://telephony_bridge_svc/twiml-call-start;
            include proxy_params.conf;
        }

        location = /twilio-voice-token {
            proxy_pass http://call_handling_svc/twilio-voice-token;
            include proxy_params.conf;
        }

        location = /twiml-softphone-outgoing {
            proxy_pass http://call_handling_svc/twiml-softphone-outgoing;
            include proxy_params.conf;
        }

        location /twiml-/ {
            proxy_pass http://telephony_bridge_svc;
            include proxy_params.conf;
        }

        location /twilio-/ {
            proxy_pass http://telephony_bridge_svc;
            include proxy_params.conf;
        }
    }
}
